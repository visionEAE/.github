name: commit-convention

# Reusable workflow: every visionEAE repository calls it from its own
# .github/workflows/commit-convention.yml. The regex is the same one used by the local
# commit-msg hook (scripts/check-commit-message.sh in this repository).
on:
  workflow_call:

jobs:
  check-commit-messages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate each commit message in the pull request
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          TYPES='feat|fix|refactor|test|docs|build|ci|chore|perf|style|revert'
          PATTERN="^(${TYPES})(\([a-z0-9-]+\))?!?: [a-z0-9].{0,71}$"
          failed=0
          for sha in $(git rev-list --no-merges "$BASE..$HEAD"); do
            summary="$(git log -1 --format='%s' "$sha")"
            if printf '%s' "$summary" | grep -Eq "$PATTERN" && ! printf '%s' "$summary" | grep -Eq '\.$'; then
              echo "✔ ${sha:0:7} $summary"
            else
              echo "✖ ${sha:0:7} $summary"; failed=1
            fi
          done
          if [ "$failed" -ne 0 ]; then
            echo; echo "Expected: <type>(<optional-scope>): <lowercase imperative summary>  — see CONTRIBUTING.md"; exit 1
          fi
